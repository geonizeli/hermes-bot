[package]
name = "hermes-bot"
version = "0.1.0"
edition = "2024"

[dependencies]
cxx = "1.0.205"
cxx-qt = "0.10.0"
cxx-qt-lib = { version = "0.10.0", features = ["qt_gui", "qt_qml", "qt_quickcontrols"] }
notify = "8.2.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
toml = "1.2.1"

[build-dependencies]
cxx-qt-build = "0.10.0"

[dev-dependencies]
tempfile = "3.27.0"
