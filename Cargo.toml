[package]
name = "hermes-bot"
version = "0.1.0"
edition = "2024"

[dependencies]
ashpd = { version = "0.14.1", default-features = false, features = ["tokio", "file_chooser"] }
base64 = "0.23.1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
flate2 = "1.1.11"
futures-util = "0.3.34"
gpui-kit = "0.11.0"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "webp", "gif", "bmp"] }
keyring = "4.2.0"
notify = "8.2.2"
open = "5.4.5"
pulldown-cmark = "0.13.6"
rand = "0.10.4"
reqwest = { version = "0.12", default-features = false, features = ["json", "cookies", "rustls-tls-native-roots"] }
resvg = { version = "0.50.0", default-features = false }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
syntect = { version = "5.3.0", default-features = false, features = ["default-fancy"] }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "net", "sync", "time", "io-util", "fs", "process"] }
tokio-tungstenite = { version = "0.30.0", features = ["rustls-tls-native-roots"] }
toml = "1.2.1"
unicode-normalization = { version = "0.1.26", default-features = false }
url = "2.5.8"
uuid = { version = "1.29.3", features = ["v4"] }

[dev-dependencies]
gpui-kit = { version = "0.11.0", features = ["test-support"] }
tempfile = "3.27.0"
